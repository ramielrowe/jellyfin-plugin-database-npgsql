name: Kubernetes plugin seed image

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: kubernetes-seed-image-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A release may already have changed registry tags, so it is never cancelled.
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-seed
  LOCAL_IMAGE: jellyfin-npgsql-seed:ci
  LINUXSERVER_REGRESSION_IMAGE: jellyfin-npgsql-linuxserver:seed-regression

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate seed-image release contract
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          version=$(jq -er '.version' build/release-policy.json)
          install_directory=$(jq -er '.installationDirectory' build/release-policy.json)
          target_abi=$(jq -er '.targetAbi' build/release-policy.json)
          test "$version" = "$(jq -er '.version' meta.json)"
          test "$target_abi" = "$(jq -er '.targetAbi' meta.json)"
          grep -Fq "<Version>$version</Version>" Directory.Build.props
          grep -Fq "ARG PLUGIN_VERSION=$version" docker/kubernetes/Dockerfile
          grep -Fq "ARG INSTALLATION_DIRECTORY=\"$install_directory\"" docker/kubernetes/Dockerfile
          grep -Fq 'debian:bookworm-slim@sha256:a4672c0cb26fbdde88e38fa2dfb6c681942306680e41e4378b28770b6e79ee91' docker/kubernetes/Dockerfile
          grep -Fq 'USER 1000:1000' docker/kubernetes/Dockerfile
          grep -Fq 'org.opencontainers.image.licenses="GPL-3.0-only"' docker/kubernetes/Dockerfile
          grep -Fq "plugin \`$version\`" docker/kubernetes/README.md
          grep -Fq "\`$target_abi\`" docker/kubernetes/README.md
          grep -Fq "ghcr.io/${GITHUB_REPOSITORY}-seed" docker/kubernetes/README.md
          grep -Fq 'replicas: 1' docker/kubernetes/deployment.yaml
          grep -Fq 'type: Recreate' docker/kubernetes/deployment.yaml
          grep -Fq 'automountServiceAccountToken: false' docker/kubernetes/deployment.yaml
          grep -Fq 'kubernetes.io/arch: amd64' docker/kubernetes/deployment.yaml
          grep -Fq 'fsGroup: 1000' docker/kubernetes/deployment.yaml
          grep -Fq 'fsGroupChangePolicy: OnRootMismatch' docker/kubernetes/deployment.yaml
          grep -Fq 'supplementalGroupsPolicy: Strict' docker/kubernetes/deployment.yaml
          grep -Fq 'secretName: REPLACE_WITH_POSTGRES_PASSFILE_SECRET' docker/kubernetes/deployment.yaml
          grep -Fq 'defaultMode: 0400' docker/kubernetes/deployment.yaml
          grep -Fq 'pre-owned by `1000:1000`' docker/kubernetes/README.md
          grep -Fq 'linuxserver/jellyfin:12.2ubu2604-ls53@sha256:1bb4f88d822a0510bb3604b68aacb80d77c1d2a30181e500090c65111b98723b' docker/kubernetes/deployment.yaml
          test "$(printf '%s\n' \
            Jellyfin.Plugin.Database.Npgsql.deps.json \
            Jellyfin.Plugin.Database.Npgsql.dll \
            LICENSE \
            Npgsql.EntityFrameworkCore.PostgreSQL.dll \
            Npgsql.dll \
            THIRD-PARTY-NOTICES.md \
            meta.json)" = "$(cat docker/common/package-files.txt)"
          cmp -s docker/linuxserver/Dockerfile.dockerignore docker/kubernetes/Dockerfile.dockerignore || {
            # Their allowlists must cover the same shared source/build inputs;
            # LinuxServer additionally includes its s6 root.
            comm -23 \
              <(grep '^!' docker/kubernetes/Dockerfile.dockerignore | sort) \
              <(grep '^!' docker/linuxserver/Dockerfile.dockerignore | sort) | test "$(cat)" = ''
          }
          bash -n docker/common/build-seed.sh
          bash -n docker/common/install-plugin.sh
          bash -n docker/kubernetes/smoke-test.sh
          bash -n docker/linuxserver/root/etc/s6-overlay/s6-rc.d/init-npgsql-plugin/run
          bash -n docker/linuxserver/smoke-test.sh
          if [[ "${{ github.event_name }}" == release ]]; then
            test "${{ github.event.release.tag_name }}" = "v$version"
          fi

  build-and-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pull the LinuxServer base image from ghcr.io as an authenticated client,
      # not anonymously through lscr.io's shared, rate-limited proxy.
      - name: Authenticate to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Build local seed image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: docker/kubernetes/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha,scope=kubernetes-seed-image
          cache-to: type=gha,mode=max,scope=kubernetes-seed-image
      - name: Run installer and stock-Jellyfin smoke test
        run: docker/kubernetes/smoke-test.sh "$LOCAL_IMAGE"
      - name: Build refactored LinuxServer derivative
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: docker/linuxserver/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LINUXSERVER_REGRESSION_IMAGE }}
          cache-from: type=gha,scope=kubernetes-linuxserver-regression
          cache-to: type=gha,mode=max,scope=kubernetes-linuxserver-regression
      - name: Run derivative regression smoke test
        run: docker/linuxserver/smoke-test.sh "$LINUXSERVER_REGRESSION_IMAGE"

  release-qualification:
    if: github.event_name == 'release'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep setup-dotnet's cache path aligned with verify-release.sh.
      NUGET_PACKAGES: ${{ github.workspace }}/.packages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The predecessor fixture's pinned assembly hash covers its portable PDB ID,
      # which records the exact compiler and the .NET runtime it ran on. Install
      # the exact SDK in isolation so newer runner-image SDKs and runtimes are not
      # selected by roll-forward.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run canonical release qualification
        run: ./scripts/verify-release.sh

  publish:
    if: github.event_name == 'release'
    needs: [validate, build-and-smoke, release-qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Authenticate to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate release tags
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -er '.version' build/release-policy.json)
          short_sha=${GITHUB_SHA:0:12}
          {
            echo 'tags<<EOF'
            echo "$IMAGE_NAME:$version"
            echo "$IMAGE_NAME:sha-$short_sha"
            echo "$IMAGE_NAME:latest"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Publish image, SBOM, and maximum provenance
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: docker/kubernetes/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          cache-from: type=gha,scope=kubernetes-seed-image
          cache-to: type=gha,mode=max,scope=kubernetes-seed-image
          annotations: |
            index:org.opencontainers.image.source=https://github.com/ramielrowe/jellyfin-plugin-database-npgsql
            index:org.opencontainers.image.description=Non-root Kubernetes init image that atomically seeds the Jellyfin Npgsql database provider
            index:org.opencontainers.image.licenses=GPL-3.0-only
          sbom: true
          provenance: mode=max
      - name: Attest published image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify anonymous tag and digest access
        env:
          EXPECTED_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
          anonymous_config=$(mktemp -d "$RUNNER_TEMP/docker-seed-anonymous.XXXXXX")
          trap 'rm -rf -- "$anonymous_config"' EXIT
          version=$(jq -er '.version' build/release-policy.json)
          short_sha=${GITHUB_SHA:0:12}
          verify_anonymous_ref() {
            local reference=$1 actual_digest
            actual_digest=$(DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect \
              "$reference" --format '{{json .Manifest}}' | jq -er '.digest')
            if [[ "$actual_digest" != "$EXPECTED_DIGEST" ]]; then
              printf 'published reference %s resolved to %s, expected %s\n' \
                "$reference" "$actual_digest" "$EXPECTED_DIGEST" >&2
              return 1
            fi
          }
          verify_anonymous_ref "$IMAGE_NAME:$version"
          verify_anonymous_ref "$IMAGE_NAME:sha-$short_sha"
          verify_anonymous_ref "$IMAGE_NAME:latest"
          verify_anonymous_ref "$IMAGE_NAME@$EXPECTED_DIGEST"
